name: Build Mobile App (Android 12+ & iOS 17+)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mobile:
    name: Build Web, Android APK & iOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies (with legacy-peer-deps for Vite/Esbuild compatibility)
        run: |
          npm install --legacy-peer-deps

      - name: Generate package-lock.json if missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --legacy-peer-deps --package-lock-only
          fi

      - name: Build Web App & PWA
        run: npm run build

      - name: Install Capacitor CLI & Android Core
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps

      - name: Initialize Capacitor Android Project properly
        run: |
          rm -rf android
          npx cap init ConnectMate com.connectmate.app --web-dir dist --yes || true
          npx cap add android

      - name: Enforce Minimum SDK 31 (Android 12+) and fix rootProject syntax in build.gradle
        run: |
          BUILD_GRADLE="android/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 31/g' "$BUILD_GRADLE" || true
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 34/g' "$BUILD_GRADLE" || true
          fi
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/minSdk [0-9]*/minSdk 31/g' "$APP_GRADLE" || true
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 31/g' "$APP_GRADLE" || true
            sed -i 's/targetSdk [0-9]*/targetSdk 34/g' "$APP_GRADLE" || true
            # Fix potential rootProject null reference in older plugin blocks
            sed -i "s/rootProject.ext./rootProject.hasProperty('ext') ? rootProject.ext. : /g" "$APP_GRADLE" || true
          fi

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Ensure gradlew exists and is executable
        run: |
          if [ ! -f "android/gradlew" ]; then
            cd android
            gradle wrapper
          fi
          chmod +x android/gradlew

      - name: Build Debug APK with Gradle inside android root
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ConnectMate-Android12-Debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
