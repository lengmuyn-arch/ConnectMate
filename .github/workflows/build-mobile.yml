name: Build Mobile App (Android 12+ & iOS 17+)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web-pwa:
    name: Build PWA Web Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App & PWA
        run: npm run build

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: connectmate-web-build
          path: dist/

  build-android-apk:
    name: Build Android APK (Min SDK 31 / Android 12+)
    runs-on: ubuntu-latest
    needs: build-web-pwa

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Install Capacitor CLI & Android Core
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor Android Project
        run: |
          npx cap init ConnectMate com.connectmate.app --web-dir dist --yes || true
          npx cap add android

      - name: Enforce Minimum SDK 31 (Android 12+) in build.gradle
        run: |
          BUILD_GRADLE="android/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 31/g' "$BUILD_GRADLE" || true
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 34/g' "$BUILD_GRADLE" || true
          fi
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/minSdk [0-9]*/minSdk 31/g' "$APP_GRADLE" || true
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 31/g' "$APP_GRADLE" || true
            sed -i 's/targetSdk [0-9]*/targetSdk 34/g' "$APP_GRADLE" || true
          fi

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ConnectMate-Android12-Debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios-ipa:
    name: Build iOS Simulator App (Min iOS 17+)
    runs-on: macos-latest
    needs: build-web-pwa

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Install Capacitor CLI & iOS Core
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Initialize Capacitor iOS Project
        run: |
          npx cap init ConnectMate com.connectmate.app --web-dir dist --yes || true
          npx cap add ios

      - name: Sync Web Assets to iOS
        run: npx cap sync ios

      - name: Set Minimum iOS Deployment Target to 17.0
        run: |
          PODFILE="ios/App/Podfile"
          if [ -f "$PODFILE" ]; then
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '17.0'/g" "$PODFILE" || true
          fi
          # Note: Full signed .ipa for real iOS devices requires Apple Developer Certificates & Provisioning Profiles.
          echo "iOS 17.0 project configured successfully via Capacitor."

      - name: Archive iOS Build Status
        uses: actions/upload-artifact@v4
        with:
          name: ConnectMate-iOS17-Project
          path: ios/
