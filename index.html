    <!-- Suppress dev environment Vite HMR WebSocket disconnects -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('closed without opened') || e.message.includes('@vite/client'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var str = String(e.reason || '');
        if (str.includes('WebSocket') || str.includes('closed without opened') || str.includes('@vite/client')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
